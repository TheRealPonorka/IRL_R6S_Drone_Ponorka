[platformio]
default_envs = esp32s3_simple_test

; Alternative board options for GOOUUU ESP32-S3 CAM N16R8

[env:esp32s3_goouuu]
platform = espressif32@^6.4.0
board = goouuu_esp32s3_cam
framework = arduino

; ===== GOOUUU ESP32-S3 CAM N16R8 v1.5 Configuration =====
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
board_upload.maximum_ram_size = 327680
board_upload.maximum_size = 16777216

; ===== Flash Configuration (16MB) =====
board_build.flash_size = 16MB
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; ===== PSRAM Configuration (8MB OPI) =====
board_build.psram_type = opi
board_build.arduino.psram_type = opi

; ===== Build Flags =====
build_flags =
    -DBOARD_HAS_PSRAM
    -DPSRAM_SIZE=8388608
    -DARDUINO_ESP32S3_DEV
    -DESP32S3
    -DCONFIG_SPIRAM_USE_MALLOC
    -DCONFIG_SPIRAM_CACHE_WORKAROUND
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS
    -DCAMERA_MODEL_ESP32S3_EYE
    -DUSE_ESP32_FRAMEWORK_ARDUINO
    ; Rainbow Six Siege specific
    -DR6_RECON_DRONE
    -DFIRMWARE_VERSION=\"1.0.0\"
    ; Performance optimizations
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; ===== Upload Configuration =====
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ===== Libraries =====
lib_deps =
    ; === Essential Libraries Only ===
    ; ESP32 Camera
    espressif/esp32-camera@^2.0.4
    
    ; LED control
    adafruit/Adafruit NeoPixel@^1.12.0
    
    ; Web server (using GitHub versions for compatibility)
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    
    ; JSON handling
    bblanchon/ArduinoJson@^6.21.5
    
    ; PID control
    br3ttb/PID@^1.2.1
    
    ; Basic utilities
    rlogiacco/CircularBuffer@^1.3.3

; ===== Advanced Build Configuration =====
build_type = release

; Development environment (uncomment for debugging)
; build_type = debug
; build_flags = ${env:esp32s3_r6drone.build_flags}
;     -DDEBUG_ESP_PORT=Serial
;     -DDEBUG_ESP_CORE
;     -DDEBUG_ESP_WIFI
;     -DDEBUG_ESP_HTTP_CLIENT
;     -DDEBUG_ESP_HTTP_SERVER

; ===== Custom Build Scripts =====
; Uncomment if you need custom build scripts
; extra_scripts = 
;     pre:scripts/pre_build.py
;     post:scripts/post_build.py

[env:esp32s3_r6drone_debug]
extends = env:esp32s3_goouuu
build_type = debug
build_flags = ${env:esp32s3_r6drone.build_flags}
    -DDEBUG_ENABLED=1
    -DCORE_DEBUG_LEVEL=5
    -DDEBUG_ESP_PORT=Serial
    -DDEBUG_ESP_CORE
    -DDEBUG_ESP_CAMERA
    -DCONFIG_ARDUHAL_LOG_COLORS
monitor_filters = 
    esp32_exception_decoder
    colorize
    time

[env:esp32s3_r6drone_ota]
extends = env:esp32s3_goouuu
upload_protocol = espota
; Upload via WiFi (change IP to your drone's IP)
upload_port = 192.168.1.100
upload_flags =
    --port=3232
    --auth=R6ReconDrone

; ===== Alternative Board Configurations =====
; Try these if the custom board doesn't work

