[env:esp32s3_simple_test]
platform = espressif32@^6.4.0  
board = esp32-s3-devkitc-1
framework = arduino
; ===== Minimal test configuration =====
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
board_build.psram_type = opi
build_flags = 
    -DBOARD_HAS_PSRAM
    -DCONFIG_ESP32_SPIRAM_SUPPORT=1
    -DARDUINO_ESP32S3_DEV
    -DESP32S3
    -DCAMERA_MODEL_ESP32S3_EYE
lib_deps = 
    adafruit/Adafruit NeoPixel@^1.12.0
    espressif/esp32-camera@^2.0.4
    sparkfun/SparkFun BMI270 Arduino Library@^1.0.1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<main_camera_stream.cpp> -<main_simple_stable.cpp> -<main_integrated.cpp> -<main_simple_new.cpp> -<main_simple.cpp> -<main.cpp>

[env:esp32s3_full_drone]
platform = espressif32@^6.4.0  
board = esp32-s3-devkitc-1
framework = arduino
; ===== Full R6 Drone Configuration =====
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
board_build.psram_type = opi
build_flags = 
    -DBOARD_HAS_PSRAM
    -DCONFIG_ESP32_SPIRAM_SUPPORT=1
    -DARDUINO_ESP32S3_DEV
    -DESP32S3
    -DCAMERA_MODEL_ESP32S3_EYE
    -DR6_RECON_DRONE
    -DCORE_DEBUG_LEVEL=3
    -Os
lib_deps = 
    ; Only essential libraries (no AsyncWebServer that might conflict)
    adafruit/Adafruit NeoPixel@^1.10.7
    ; PID control
    br3ttb/PID@^1.2.1
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<main.cpp> -<main_simple.cpp>

