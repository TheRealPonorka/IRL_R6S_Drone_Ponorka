<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>R6 Recon Drone Control</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAA4AAAAOCAYAAAAfSC3RAAAAVklEQVQoU2NkIBMwkqifYdQbI98bJLvx9evXDKmpqQynTp1i+P//PwMDAwPD+fPnGVJSUhj+/PnDcO7cOYa///4x/P37l+Hfv38MJLvx////DH///mX4//8/AHuZS6VYXHKdAAAAAElFTkSuQmCC">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            touch-action: manipulation;
        }

        .container {
            display: grid;
            grid-template-areas: 
                "left-controls camera-area right-controls"
                "bottom-left camera-area bottom-right";
            grid-template-columns: 120px 1fr 120px;
            grid-template-rows: 1fr 100px;
            height: 100vh;
            width: 100vw;
            gap: 10px;
            padding: 10px;
        }

        /* Camera Stream Area */
        .camera-container {
            grid-area: camera-area;
            position: relative;
            background: #000;
            border: 2px solid #FF8C00;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.3);
        }

        .camera-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        /* Camera Overlay Controls */
        .camera-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .overlay-button {
            position: absolute;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            color: white;
            font-size: 18px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }

        .overlay-button:hover,
        .overlay-button.active {
            background: rgba(255, 140, 0, 0.8);
            border-color: #FF8C00;
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.6);
        }

        .mic-toggle {
            top: 15px;
            right: 15px;
        }

        .spotlight-toggle {
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
        }

        .fullscreen-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 4px;
            color: white;
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
        }

        /* Movement Controls */
        .left-controls {
            grid-area: left-controls;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .right-controls {
            grid-area: right-controls;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .movement-button {
            width: 80px;
            height: 80px;
            border: 2px solid #FF8C00;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 140, 0, 0.2), rgba(255, 140, 0, 0.1));
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.2);
            touch-action: manipulation;
        }

        .movement-button:hover,
        .movement-button:active {
            background: linear-gradient(135deg, rgba(255, 140, 0, 0.8), rgba(255, 140, 0, 0.6));
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(255, 140, 0, 0.4);
            border-color: #FFB347;
        }

        .movement-button.pressed {
            background: linear-gradient(135deg, #FF8C00, #FFB347);
            transform: scale(0.95);
            box-shadow: inset 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* Bottom Controls */
        .bottom-left {
            grid-area: bottom-left;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .bottom-right {
            grid-area: bottom-right;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: flex-end;
        }

        .control-button {
            padding: 12px 16px;
            border: 2px solid #FF8C00;
            border-radius: 8px;
            background: rgba(255, 140, 0, 0.1);
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-button:hover {
            background: rgba(255, 140, 0, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.3);
        }

        .control-button.active {
            background: linear-gradient(135deg, #FF8C00, #FFB347);
            box-shadow: 0 4px 20px rgba(255, 140, 0, 0.5);
        }

        /* LED Color Picker */
        .color-picker-container {
            position: relative;
        }

        .color-picker {
            width: 40px;
            height: 40px;
            border: 2px solid #FF8C00;
            border-radius: 50%;
            background: #FF8C00;
            cursor: pointer;
        }

        .color-palette {
            position: absolute;
            bottom: 50px;
            left: 0;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #FF8C00;
            border-radius: 8px;
            padding: 15px;
            display: none;
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .color-palette.show {
            display: block;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(6, 30px);
            gap: 5px;
            margin-bottom: 10px;
        }

        .color-option {
            width: 30px;
            height: 30px;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .color-option:hover,
        .color-option.selected {
            border-color: white;
            transform: scale(1.1);
        }

        .rgb-inputs {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .rgb-input {
            width: 40px;
            padding: 4px;
            border: 1px solid #666;
            background: #333;
            color: white;
            font-size: 10px;
            text-align: center;
            border-radius: 3px;
        }

        /* Status Indicators */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 30px;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.6));
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-size: 12px;
            gap: 20px;
            z-index: 100;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.online {
            background: #00ff00;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.6);
        }

        .status-dot.warning {
            background: #ffaa00;
            box-shadow: 0 0 8px rgba(255, 170, 0, 0.6);
        }

        .status-dot.error {
            background: #ff0000;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
        }

        /* Telemetry Data */
        .telemetry-panel {
            position: absolute;
            top: 40px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 140, 0, 0.5);
            border-radius: 6px;
            padding: 10px;
            font-size: 11px;
            backdrop-filter: blur(5px);
            display: none;
        }

        .telemetry-panel.show {
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 100px 1fr 100px;
                gap: 5px;
                padding: 5px;
            }

            .movement-button {
                width: 60px;
                height: 60px;
                font-size: 14px;
            }

            .overlay-button {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }

            .control-button {
                padding: 10px 12px;
                font-size: 10px;
            }
        }

        @media (max-width: 480px) {
            .container {
                grid-template-columns: 80px 1fr 80px;
                grid-template-rows: 1fr 80px;
            }

            .movement-button {
                width: 50px;
                height: 50px;
                font-size: 12px;
            }

            .control-button {
                padding: 8px 10px;
                font-size: 9px;
            }
        }

        /* Connection Lost Animation */
        @keyframes connectionLost {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        .connection-lost {
            animation: connectionLost 1s infinite;
        }

        /* Loading Spinner */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 140, 0, 0.3);
            border-top: 3px solid #FF8C00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Emergency Mode */
        .emergency-mode {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%) !important;
            border-color: #ff4444 !important;
            animation: emergencyPulse 0.5s infinite alternate;
        }

        @keyframes emergencyPulse {
            from { box-shadow: 0 0 20px rgba(255, 0, 0, 0.8); }
            to { box-shadow: 0 0 30px rgba(255, 0, 0, 1); }
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-indicator">
            <div class="status-dot" id="connection-status"></div>
            <span id="connection-text">Connecting...</span>
        </div>
        <div class="status-indicator">
            <div class="status-dot" id="balance-status"></div>
            <span id="balance-text">Initializing...</span>
        </div>
        <div class="status-indicator">
            <div class="status-dot" id="camera-status"></div>
            <span id="camera-text">Camera Loading...</span>
        </div>
        <div class="status-indicator" onclick="toggleTelemetry()">
            📊 Telemetry
        </div>
    </div>

    <!-- Telemetry Panel -->
    <div class="telemetry-panel" id="telemetry-panel">
        <div>Pitch: <span id="pitch-value">0.0°</span></div>
        <div>Roll: <span id="roll-value">0.0°</span></div>
        <div>Battery: <span id="battery-value">---%</span></div>
        <div>Uptime: <span id="uptime-value">0s</span></div>
    </div>

    <div class="container">
        <!-- Left Movement Controls -->
        <div class="left-controls">
            <button class="movement-button" id="forward-btn">
                ▲<br>FORWARD
            </button>
            <button class="movement-button" id="backward-btn">
                ▼<br>BACK
            </button>
        </div>

        <!-- Camera Stream Area -->
        <div class="camera-container">
            <img class="camera-stream" id="camera-stream" src="/stream" alt="Camera Stream">
            <div class="loading-spinner" id="camera-loading"></div>
            
            <div class="camera-overlay">
                <!-- Microphone Toggle (Top Right) -->
                <button class="overlay-button mic-toggle" id="mic-toggle" title="Microphone On/Off">
                    🎤
                </button>
                
                <!-- Spotlight Toggle (Bottom Center) -->
                <button class="overlay-button spotlight-toggle" id="spotlight-toggle" title="Spotlight On/Off">
                    💡
                </button>
            </div>
            
            <!-- Fullscreen Toggle -->
            <button class="fullscreen-toggle" onclick="toggleFullscreen()">
                ⛶ FULLSCREEN
            </button>
        </div>

        <!-- Right Movement Controls -->
        <div class="right-controls">
            <button class="movement-button" id="left-btn">
                ◀<br>LEFT
            </button>
            <button class="movement-button" id="right-btn">
                ▶<br>RIGHT
            </button>
        </div>

        <!-- Bottom Left Controls -->
        <div class="bottom-left">
            <!-- LED Color Picker -->
            <div class="color-picker-container">
                <div class="color-picker" id="color-picker" onclick="toggleColorPalette()"></div>
                <div class="color-palette" id="color-palette">
                    <div class="color-grid" id="color-grid"></div>
                    <div class="rgb-inputs">
                        <input type="number" class="rgb-input" id="r-input" min="0" max="255" value="255" placeholder="R">
                        <input type="number" class="rgb-input" id="g-input" min="0" max="255" value="140" placeholder="G">
                        <input type="number" class="rgb-input" id="b-input" min="0" max="255" value="0" placeholder="B">
                    </div>
                </div>
            </div>
            
            <!-- LED Strip Toggle -->
            <button class="control-button" id="led-toggle">
                LED STRIP
            </button>
        </div>

        <!-- Bottom Right Controls -->
        <div class="bottom-right">
            <button class="control-button" onclick="openTuningAssistant()">
                🎯 TUNING
            </button>
            <button class="control-button" onclick="openCameraSettings()">
                ⚙️ CAMERA
            </button>
        </div>
    </div>

    <script>
        // Global variables
        let ws;
        let isConnected = false;
        let currentStates = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            microphone: false,
            spotlight: false,
            ledStrip: true,                     // Start with LEDs enabled
            ledColor: { r: 0, g: 255, b: 0 }   // Start with green color
        };

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initializeControls();
            setupWebSocket();
            initializeColorPalette();
            setupCameraStream();
        });

        // WebSocket Connection
        function setupWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.hostname}:81`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                console.log('WebSocket connected');
                isConnected = true;
                updateConnectionStatus('online', 'Connected');
            };
            
            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    handleTelemetryData(data);
                } catch (e) {
                    console.error('Failed to parse WebSocket message:', e);
                }
            };
            
            ws.onclose = function() {
                console.log('WebSocket disconnected');
                isConnected = false;
                updateConnectionStatus('error', 'Disconnected');
                
                // Attempt to reconnect after 3 seconds
                setTimeout(setupWebSocket, 3000);
            };
            
            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
                updateConnectionStatus('error', 'Connection Error');
            };
        }

        // Initialize Controls
        function initializeControls() {
            // Movement buttons with touch support
            setupButton('forward-btn', 'forward', true);
            setupButton('backward-btn', 'backward', true);
            setupButton('left-btn', 'left', true);
            setupButton('right-btn', 'right', true);
            
            // Toggle buttons
            setupToggleButton('mic-toggle', 'microphone');
            setupToggleButton('spotlight-toggle', 'spotlight');
            setupToggleButton('led-toggle', 'ledStrip');
            
            // Set initial LED button state to active
            document.getElementById('led-toggle').classList.add('active');
            
            // RGB input listeners
            ['r-input', 'g-input', 'b-input'].forEach(id => {
                document.getElementById(id).addEventListener('input', updateLEDColor);
            });
            
            // Set initial RGB values to green
            document.getElementById('r-input').value = 0;
            document.getElementById('g-input').value = 255;
            document.getElementById('b-input').value = 0;
            updateColorPicker();
        }

        // Setup button with both mouse and touch events
        function setupButton(buttonId, command, holdable = false) {
            const button = document.getElementById(buttonId);
            let isPressed = false;
            let pressInterval;
            
            function startPress() {
                if (isPressed) return;
                isPressed = true;
                button.classList.add('pressed');
                currentStates[command] = true;
                sendCommand(command, true);
                
                if (holdable) {
                    // Send continuous commands while held
                    pressInterval = setInterval(() => {
                        if (isPressed) {
                            sendCommand(command, true);
                        }
                    }, 100);
                }
            }
            
            function endPress() {
                if (!isPressed) return;
                isPressed = false;
                button.classList.remove('pressed');
                currentStates[command] = false;
                sendCommand(command, false);
                
                if (pressInterval) {
                    clearInterval(pressInterval);
                    pressInterval = null;
                }
            }
            
            // Mouse events
            button.addEventListener('mousedown', startPress);
            button.addEventListener('mouseup', endPress);
            button.addEventListener('mouseleave', endPress);
            
            // Touch events
            button.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startPress();
            });
            
            button.addEventListener('touchend', (e) => {
                e.preventDefault();
                endPress();
            });
            
            button.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                endPress();
            });
        }

        // Setup toggle button
        function setupToggleButton(buttonId, command) {
            const button = document.getElementById(buttonId);
            
            button.addEventListener('click', (e) => {
                e.preventDefault();
                currentStates[command] = !currentStates[command];
                button.classList.toggle('active', currentStates[command]);
                sendCommand(command, currentStates[command]);
            });
        }

        // Send command to drone
        function sendCommand(command, value) {
            if (!isConnected || !ws) return;
            
            const message = {
                command: command,
                value: value,
                timestamp: Date.now()
            };
            
            // Add color data for LED commands
            if (command === 'ledStrip' || command === 'ledcolor') {
                message.color = currentStates.ledColor;
            }
            
            try {
                ws.send(JSON.stringify(message));
            } catch (e) {
                console.error('Failed to send command:', e);
            }
        }

        // Initialize Color Palette
        function initializeColorPalette() {
            const grid = document.getElementById('color-grid');
            const predefinedColors = [
                '#FF8C00', '#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF',
                '#00FFFF', '#FFFFFF', '#FFA500', '#800080', '#008000', '#000080',
                '#FFB6C1', '#20B2AA', '#87CEEB', '#DDA0DD', '#90EE90', '#F0E68C',
                '#FF6347', '#40E0D0', '#EE82EE', '#98FB98', '#F5DEB3', '#FF69B4',
                '#00CED1', '#FF1493', '#00BFFF', '#ADFF2F', '#FF4500', '#DA70D6'
            ];
            
            predefinedColors.forEach(color => {
                const colorDiv = document.createElement('div');
                colorDiv.className = 'color-option';
                colorDiv.style.backgroundColor = color;
                colorDiv.onclick = () => selectColor(color);
                grid.appendChild(colorDiv);
            });
            
            updateColorPicker();
        }

        // Color picker functions
        function toggleColorPalette() {
            const palette = document.getElementById('color-palette');
            palette.classList.toggle('show');
        }

        function selectColor(colorHex) {
            const r = parseInt(colorHex.slice(1, 3), 16);
            const g = parseInt(colorHex.slice(3, 5), 16);
            const b = parseInt(colorHex.slice(5, 7), 16);
            
            currentStates.ledColor = { r, g, b };
            
            document.getElementById('r-input').value = r;
            document.getElementById('g-input').value = g;
            document.getElementById('b-input').value = b;
            
            updateColorPicker();
            sendCommand('ledcolor', `${r},${g},${b}`);
            
            document.getElementById('color-palette').classList.remove('show');
        }

        function updateLEDColor() {
            const r = parseInt(document.getElementById('r-input').value) || 0;
            const g = parseInt(document.getElementById('g-input').value) || 0;
            const b = parseInt(document.getElementById('b-input').value) || 0;
            
            currentStates.ledColor = { r, g, b };
            updateColorPicker();
            sendCommand('ledcolor', `${r},${g},${b}`);
        }

        function updateColorPicker() {
            const { r, g, b } = currentStates.ledColor;
            const colorHex = `rgb(${r}, ${g}, ${b})`;
            document.getElementById('color-picker').style.backgroundColor = colorHex;
        }

        // Camera and UI functions
        function setupCameraStream() {
            const stream = document.getElementById('camera-stream');
            const loading = document.getElementById('camera-loading');
            
            stream.onload = () => {
                loading.style.display = 'none';
                updateCameraStatus('online', 'Streaming');
            };
            
            stream.onerror = () => {
                loading.style.display = 'none';
                updateCameraStatus('error', 'Stream Error');
            };
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function toggleTelemetry() {
            const panel = document.getElementById('telemetry-panel');
            panel.classList.toggle('show');
        }

        function openTuningAssistant() {
            window.open('/tuning.html', '_blank', 'width=1200,height=800');
        }

        function openCameraSettings() {
            window.open('/camera-config', '_blank', 'width=800,height=600');
        }

        // Status update functions
        function updateConnectionStatus(status, text) {
            document.getElementById('connection-status').className = `status-dot ${status}`;
            document.getElementById('connection-text').textContent = text;
        }

        function updateBalanceStatus(status, text) {
            document.getElementById('balance-status').className = `status-dot ${status}`;
            document.getElementById('balance-text').textContent = text;
        }

        function updateCameraStatus(status, text) {
            document.getElementById('camera-status').className = `status-dot ${status}`;
            document.getElementById('camera-text').textContent = text;
        }

        // Handle telemetry data from drone
        function handleTelemetryData(data) {
            if (data.pitch !== undefined) {
                document.getElementById('pitch-value').textContent = data.pitch.toFixed(1) + '°';
            }
            
            if (data.roll !== undefined) {
                document.getElementById('roll-value').textContent = data.roll.toFixed(1) + '°';
            }
            
            if (data.battery !== undefined) {
                document.getElementById('battery-value').textContent = data.battery.toFixed(0) + '%';
            }
            
            if (data.uptime !== undefined) {
                const uptime = Math.floor(data.uptime / 1000);
                document.getElementById('uptime-value').textContent = formatUptime(uptime);
            }
            
            if (data.balanced !== undefined) {
                if (data.balanced) {
                    updateBalanceStatus('online', 'Balanced');
                } else {
                    updateBalanceStatus('warning', 'Balancing...');
                }
            }
            
            if (data.emergency !== undefined && data.emergency) {
                updateBalanceStatus('error', 'EMERGENCY STOP');
                document.body.classList.add('emergency-mode');
            } else {
                document.body.classList.remove('emergency-mode');
            }
        }

        function formatUptime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            if (hours > 0) {
                return `${hours}h ${minutes}m ${secs}s`;
            } else if (minutes > 0) {
                return `${minutes}m ${secs}s`;
            } else {
                return `${secs}s`;
            }
        }

        // Prevent context menu and zoom
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        
        // Keyboard shortcuts (for development)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                // Emergency stop
                Object.keys(currentStates).forEach(key => {
                    if (typeof currentStates[key] === 'boolean') {
                        currentStates[key] = false;
                        sendCommand(key, false);
                    }
                });
            }
        });

        // Auto-reconnect camera stream
        setInterval(() => {
            const stream = document.getElementById('camera-stream');
            if (stream.complete && stream.naturalHeight === 0) {
                stream.src = stream.src; // Reload the stream
            }
        }, 5000);
    </script>
</body>
</html>
