[platformio]
default_envs = esp32s3_minimal

[env:esp32s3_minimal]
platform = espressif32@^6.4.0
board = esp32-s3-devkitc-1
framework = arduino

; ===== Minimal Configuration for GOOUUU ESP32-S3 CAM =====
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
board_upload.maximum_ram_size = 327680
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = opi

; ===== Minimal Essential Libraries =====
lib_deps =
    ; Only the most basic libraries
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^6.21.5

; ===== Build Configuration =====
build_flags =
    -DBOARD_HAS_PSRAM
    -DPSRAM_SIZE=8388608
    -DARDUINO_ESP32S3_DEV
    -DESP32S3
    -DCONFIG_SPIRAM_USE_MALLOC
    -DCONFIG_SPIRAM_CACHE_WORKAROUND
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS
    -DCAMERA_MODEL_ESP32S3_EYE
    -DUSE_ESP32_FRAMEWORK_ARDUINO
    -DWIFI_MODE_STA
    -DR6_RECON_DRONE
    -DFIRMWARE_VERSION=\"1.0.0\"
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder